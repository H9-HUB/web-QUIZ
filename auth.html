<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>用户入口</title>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div class="auth-container">
  <!-- 登录 -->
  <div id="login-box" class="box active">
    <h1>Login</h1>
    <form id="loginForm">
      <input id="loginUser" type="text" placeholder="Enter your username" required autocomplete="username">
      <input id="loginPwd" type="password" placeholder="Enter your password" required autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="#" id="toReg"> Register</a></p>
  </div>

  <!-- 注册 -->
  <div id="reg-box" class="box">
    <h1>Register</h1>
    <form id="regForm">
      <input id="regUser" type="text" placeholder="Choose a username" required>
      <input id="regPwd" type="password" placeholder="Choose a password" required>
      <input id="regPwd2" type="password" placeholder="Confirm your password" required>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="#" id="toLogin"> Login</a></p>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
